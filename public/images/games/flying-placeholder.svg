<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" fill="none">
  <defs>
    <linearGradient id="shabahGradFlying" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="75%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="gridFlying" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#0A0A0A" fill-opacity="0.14" />
    </pattern>
  </defs>
  <rect width="320" height="260" fill="#F8FAFC" />
  <rect width="320" height="260" fill="url(#gridFlying)" />

  <!-- Sky Altitude Orbital Rings -->
  <circle cx="160" cy="120" r="92" stroke="#0A0A0A" stroke-width="3" stroke-dasharray="6 6" opacity="0.2" />
  <circle cx="160" cy="120" r="68" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="4 4" opacity="0.2" />

  <!-- Rocket Boost Flames -->
  <path
    d="M 144 186 C 144 210, 160 228, 160 228 C 160 228, 176 210, 176 186 Z"
    fill="#F59E0B"
    stroke="#0A0A0A"
    stroke-width="4"
  />
  <path
    d="M 152 186 C 152 202, 160 214, 160 214 C 160 214, 168 202, 168 186 Z"
    fill="#FCD34D"
  />

  <!-- Stars / Altitude Sparks -->
  <path d="M 64 64 L 68 76 L 80 80 L 68 84 L 64 96 L 60 84 L 48 80 L 60 76 Z" fill="#F59E0B" stroke="#0A0A0A" stroke-width="2.5" />
  <path d="M 252 50 L 255 58 L 264 60 L 255 62 L 252 70 L 249 62 L 240 60 L 249 58 Z" fill="#38BDF8" stroke="#0A0A0A" stroke-width="2" />
  <circle cx="260" cy="150" r="4" fill="#6366F1" />
  <circle cx="68" cy="160" r="5" fill="#A855F7" />

  <!-- Ghost Silhouette (Rocket Flying Upward) -->
  <path
    d="M 160 38 C 122 38 102 66 102 106 L 102 166 C 102 178 112 184 121 176 C 130 168 138 168 146 177 C 153 185 167 185 174 177 C 182 168 190 168 199 176 C 208 184 218 178 218 166 L 218 106 C 218 66 198 38 160 38 Z"
    fill="#FFFFFF"
    stroke="url(#shabahGradFlying)"
    stroke-width="11"
    stroke-linejoin="round"
  />
  <path
    d="M 160 38 C 122 38 102 66 102 106 L 102 166 C 102 178 112 184 121 176 C 130 168 138 168 146 177 C 153 185 167 185 174 177 C 182 168 190 168 199 176 C 208 184 218 178 218 166 L 218 106 C 218 66 198 38 160 38 Z"
    fill="#FFFFFF"
    stroke="#0A0A0A"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Flying Eyes Looking Skyward -->
  <circle cx="139" cy="94" r="12" fill="#0A0A0A" />
  <circle cx="181" cy="94" r="12" fill="#0A0A0A" />
  <circle cx="142" cy="90" r="4" fill="#FFFFFF" />
  <circle cx="184" cy="90" r="4" fill="#FFFFFF" />

  <!-- Altitude Meter Badge -->
  <g transform="translate(112, 126)">
    <rect width="96" height="26" rx="13" fill="#0A0A0A" />
    <text x="48" y="17" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">1500m 🚀</text>
  </g>
</svg>