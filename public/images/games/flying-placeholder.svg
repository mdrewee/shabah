<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" fill="none">
  <rect width="320" height="260" fill="#38BDF8" />

  <!-- Flat City Buildings Silhouette at Bottom -->
  <rect x="0" y="210" width="320" height="50" fill="#1E293B" stroke="#0A0A0A" stroke-width="4" />
  <rect x="24" y="160" width="52" height="50" fill="#334155" stroke="#0A0A0A" stroke-width="4" />
  <rect x="244" y="150" width="56" height="60" fill="#334155" stroke="#0A0A0A" stroke-width="4" />

  <!-- Flat White Clouds -->
  <g fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3.5">
    <rect x="26" y="70" width="76" height="24" rx="12" />
    <rect x="224" y="84" width="74" height="24" rx="12" />
  </g>

  <!-- Solid Shadow for Ghost -->
  <path
    d="M 164 34 C 126 34 106 62 106 102 L 106 162 C 106 174 116 180 125 172 C 134 164 142 164 150 173 C 157 181 171 181 178 173 C 186 164 194 164 203 172 C 212 180 222 174 222 162 L 222 102 C 222 62 202 34 164 34 Z"
    fill="#0A0A0A"
  />

  <!-- Ghost Silhouette Flying Upward -->
  <path
    d="M 160 28 C 122 28 102 56 102 96 L 102 156 C 102 168 112 174 121 166 C 130 158 138 158 146 167 C 153 175 167 175 174 167 C 182 158 190 158 199 166 C 208 174 218 168 218 156 L 218 96 C 218 56 198 28 160 28 Z"
    fill="#FFFFFF"
    stroke="#0A0A0A"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Flying Eyes Looking Skyward -->
  <circle cx="139" cy="84" r="11" fill="#0A0A0A" />
  <circle cx="181" cy="84" r="11" fill="#0A0A0A" />

  <!-- Altitude Meter Badge (Zero Emojis) -->
  <g transform="translate(110, 116)">
    <rect width="100" height="28" rx="8" fill="#FACC15" stroke="#0A0A0A" stroke-width="3" />
    <text x="50" y="19" fill="#0A0A0A" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" text-anchor="middle">1500 متر</text>
  </g>
</svg>
