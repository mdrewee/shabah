<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="attFireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="attGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glowAtt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EF4444" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="60" cy="60" r="54" fill="#0A0A0A" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 2"/>
  <circle cx="60" cy="60" r="48" fill="#1C0A0A"/>
  
  <!-- Goal Crosshair Target Lines -->
  <circle cx="60" cy="54" r="30" stroke="#EF4444" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 2"/>
  <line x1="60" y1="20" x2="60" y2="88" stroke="#EF4444" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="26" y1="54" x2="94" y2="54" stroke="#EF4444" stroke-width="1" stroke-opacity="0.25"/>
  
  <!-- Striker Goal Rocket & Ball -->
  <g filter="url(#glowAtt)">
    <!-- Speed Trail Flames -->
    <path d="M30 68 C38 62 46 58 56 56 C48 54 40 48 32 40 C42 46 50 50 60 52 C52 46 48 38 46 30 C54 38 60 46 64 54 Z" fill="url(#attFireGrad)" opacity="0.8"/>
    
    <!-- Rocketing Football -->
    <circle cx="68" cy="52" r="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5"/>
    <polygon points="68,44 73,48 71,55 65,55 63,48" fill="#DC2626"/>
    <path d="M68,44 L68,36 M73,48 L80,46 M71,55 L75,63 M65,55 L61,63 M63,48 L56,46" stroke="#DC2626" stroke-width="1.5"/>
    
    <!-- Target Crosshairs around the ball -->
    <path d="M68 28 L68 32 M68 72 L68 76 M44 52 L48 52 M88 52 L92 52" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Position Badge -->
  <rect x="34" y="94" width="52" height="18" rx="9" fill="#EF4444" stroke="#0A0A0A" stroke-width="2"/>
  <text x="60" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">مهاجم (ATT)</text>
</svg>