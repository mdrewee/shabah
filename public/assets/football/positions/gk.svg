<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gkGloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glowGk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="60" cy="60" r="54" fill="#0A0A0A" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 2"/>
  <circle cx="60" cy="60" r="48" fill="#17140B"/>
  
  <!-- Goal Net Grid Pattern behind glove -->
  <path d="M30 40 L90 40 M30 55 L90 55 M30 70 L90 70" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M40 30 L40 80 M60 30 L60 80 M80 30 L80 80" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25"/>
  
  <!-- Goalkeeper Gloves Grasping Ball -->
  <g filter="url(#glowGk)">
    <!-- Right Glove (facing viewer) -->
    <path d="M38 78 C34 76 32 70 34 64 L40 46 C41 42 45 40 48 42 C51 44 51 48 50 52 L48 58 L54 44 C56 40 60 40 62 43 C64 46 63 50 61 55 L57 62 L64 50 C66 46 70 47 72 50 C73 53 72 57 69 62 L63 70 C60 76 54 82 46 82 L38 78 Z" fill="url(#gkGloveGrad)"/>
    <!-- Wrist Strap -->
    <rect x="32" y="74" width="22" height="8" rx="3" fill="#B45309" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="35" y="77" width="12" height="2" rx="1" fill="#FFFFFF"/>
    
    <!-- Rubber Grip Pads on fingers -->
    <circle cx="48" cy="44" r="2.5" fill="#FDE68A"/>
    <circle cx="61" cy="45" r="2.5" fill="#FDE68A"/>
    <circle cx="71" cy="51" r="2.5" fill="#FDE68A"/>
    
    <!-- Ball being blocked / saved -->
    <circle cx="76" cy="40" r="16" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5"/>
    <polygon points="76,34 81,38 79,44 73,44 71,38" fill="#D97706"/>
    <path d="M76,34 L76,26 M81,38 L88,36 M79,44 L83,52 M73,44 L69,52 M71,38 L64,36" stroke="#D97706" stroke-width="1.5"/>
  </g>
  
  <!-- Position Badge -->
  <rect x="36" y="94" width="48" height="18" rx="9" fill="#F59E0B" stroke="#0A0A0A" stroke-width="2"/>
  <text x="60" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#0A0A0A" text-anchor="middle" dominant-baseline="middle">حارس (GK)</text>
</svg>