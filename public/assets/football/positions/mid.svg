<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="midCompassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glowMid" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="60" cy="60" r="54" fill="#0A0A0A" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="4 2"/>
  <circle cx="60" cy="60" r="48" fill="#140E24"/>
  
  <!-- Passing Radar Orbits -->
  <circle cx="60" cy="55" r="32" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="60" cy="55" r="22" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.4"/>
  <circle cx="60" cy="55" r="12" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.5"/>
  
  <!-- Tactical Compass / Playmaker Engine -->
  <g filter="url(#glowMid)">
    <!-- Passing Direction Arrows -->
    <path d="M60 22 L60 88 M27 55 L93 55" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
    <path d="M37 32 L83 78 M83 32 L37 78" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
    
    <!-- Central Control Hub / Star -->
    <polygon points="60,35 65,50 80,55 65,60 60,75 55,60 40,55 55,50" fill="url(#midCompassGrad)" stroke="#DDD6FE" stroke-width="2"/>
    <circle cx="60" cy="55" r="5" fill="#FFFFFF"/>
    
    <!-- Orbiting Passes (Tactical Vision Dots) -->
    <circle cx="82" cy="40" r="4" fill="#C4B5FD"/>
    <circle cx="38" cy="70" r="4" fill="#C4B5FD"/>
    <circle cx="78" cy="72" r="3" fill="#A78BFA"/>
    <circle cx="42" cy="38" r="3" fill="#A78BFA"/>
  </g>
  
  <!-- Position Badge -->
  <rect x="36" y="94" width="48" height="18" rx="9" fill="#8B5CF6" stroke="#0A0A0A" stroke-width="2"/>
  <text x="60" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">وسط (MID)</text>
</svg>