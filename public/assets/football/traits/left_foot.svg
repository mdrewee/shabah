<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="leftFootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glowLeft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="60" cy="60" r="54" fill="#0A0A0A" stroke="#10B981" stroke-width="3" stroke-dasharray="4 2"/>
  <circle cx="60" cy="60" r="48" fill="#141414"/>
  
  <!-- Left Foot Football Boot Silhouette -->
  <g filter="url(#glowLeft)">
    <!-- Sole & Studs -->
    <path d="M28 82 C34 84 52 86 78 80 C84 78 92 73 95 68 C96 66 93 64 89 64 C80 64 68 68 55 68 C42 68 32 65 26 73 C24 75 25 81 28 82 Z" fill="#065F46"/>
    <!-- Studs -->
    <rect x="34" y="83" width="4" height="6" rx="1.5" fill="#34D399"/>
    <rect x="46" y="84" width="4" height="6" rx="1.5" fill="#34D399"/>
    <rect x="68" y="82" width="4" height="6" rx="1.5" fill="#34D399"/>
    <rect x="80" y="79" width="4" height="6" rx="1.5" fill="#34D399"/>
    <!-- Boot Upper (Shoe Body) -->
    <path d="M26 73 C30 65 38 48 44 42 C48 38 56 36 60 44 C63 50 64 56 68 58 C74 60 84 61 93 64 C97 66 96 70 91 73 C82 78 62 82 38 80 C30 79 24 76 26 73 Z" fill="url(#leftFootGrad)"/>
    <!-- Laces & Tongue Detail -->
    <path d="M46 45 L54 53 M49 42 L57 50 M52 39 L60 47" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Swoosh / Speed Stripes -->
    <path d="M35 70 C48 70 65 64 78 54" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Striking Football at Toe -->
  <circle cx="94" cy="46" r="14" fill="url(#ballGrad)" stroke="#0A0A0A" stroke-width="2"/>
  <!-- Classic Pentagon Patterns on Ball -->
  <polygon points="94,40 98,43 96,48 92,48 90,43" fill="#0A0A0A"/>
  <path d="M94,40 L94,34 M98,43 L104,42 M96,48 L100,54 M92,48 L88,54 M90,43 L84,42" stroke="#0A0A0A" stroke-width="1.5"/>
  
  <!-- Motion Dynamic Lines -->
  <path d="M78 36 C84 38 88 42 88 46" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <path d="M84 30 C92 34 96 39 96 44" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2"/>
  
  <!-- "L" & "أشول" Label Ribbon -->
  <rect x="36" y="94" width="48" height="18" rx="9" fill="#10B981" stroke="#0A0A0A" stroke-width="2"/>
  <text x="60" y="106" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">أشول (L)</text>
</svg>